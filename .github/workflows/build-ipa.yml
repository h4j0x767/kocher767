name: Build iOS IPA Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Vite Web Project
        run: |
          npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '15.0'
          use_frameworks!

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorLocalNotifications', :path => '../../node_modules/@capacitor/local-notifications'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ""
                config.build_settings['CODE_SIGNING_REQUIRED'] = "NO"
                config.build_settings['CODE_SIGNING_ALLOWED'] = "NO"
              end
            end
          end
          EOF
          npx cap copy ios
          if [ -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj || true
          fi
          cd ios/App && pod install --repo-update && cd ../..

      - name: Configure iOS Permissions
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Dr. Smart uses camera for real-time multi-angle skin vision analysis and medication scanning.'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Dr. Smart requires photo library access to scan lab reports and skin images.'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Dr. Smart uses location to locate nearby clinics and pharmacies in emergency.'" "$PLIST" || true
          fi

      - name: Build Xcode Archive (iOS)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/App/build/App.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean archive

      - name: Package IPA File
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr Dr-Smart.ipa Payload
          ls -la Dr-Smart.ipa

      - name: Publish GitHub Release with IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.4.0-b${{ github.run_number }}"
          echo "Building release notes..."
          cat << 'EOF' > release_notes.md
          ## 📱 Dr. Smart iOS IPA Package
          
          ### ✨ تایبەتمەندیێن نوی یێن ئەپلیکەیشنێ:
          - **نۆتیفیکەیشنا زەنگا دەرمانان ب شێوازێ فەرمی یێ ئایفۆنێ**
          - **دەنگێ زەنگێ و لەرزین (Chime Sound & Haptics)**
          - **دیزاینا مۆبایل یا تایبەت بۆ ئایفۆنێ (TafsirKurd Style)**
          
          ### 📥 دابەزاندن:
          فایلا خوارێ **Dr-Smart.ipa** دابەزینە بۆ ناڤ ئایفۆنێ ب ڕێکا TrollStore یان Scarlet یان AltStore.
          EOF
          gh release create "$TAG_NAME" Dr-Smart.ipa --title "Dr. Smart iOS IPA v2.4.0 (Build ${{ github.run_number }})" --notes-file release_notes.md || true
