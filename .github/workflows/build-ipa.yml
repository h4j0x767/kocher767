name: Build iOS IPA Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Vite Web Project
        run: |
          npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Configure iOS Permissions
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Dr. Smart uses camera for real-time multi-angle skin vision analysis and medication scanning.'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Dr. Smart requires photo library access to scan lab reports and skin images.'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Dr. Smart uses location to locate nearby clinics and pharmacies in emergency.'" "$PLIST" || true
          fi

      - name: Build Xcode Archive (iOS)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/App/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package IPA File
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr Dr-Smart.ipa Payload
          ls -la Dr-Smart.ipa

      - name: Publish GitHub Release with IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.4.0-b${{ github.run_number }}"
          echo "Creating Release $TAG_NAME..."
          gh release create "$TAG_NAME" Dr-Smart.ipa \
            --title "Dr. Smart iOS IPA v2.4.0 (Build ${{ github.run_number }})" \
            --notes "## 📱 Dr. Smart iOS IPA Package (Build ${{ github.run_number }})

### ✨ تایبەتمەندیێن نوی یێن ئەپلیکەیشنێ:
- نۆتیفیکەیشنا زەنگا دەرمانان ب شێوازێ فەرمی یێ ئایفۆنێ
- دەنگێ زەنگێ و لەرزین (Chime Sound & Haptics)
- دیزاینا مۆبایل یا تایبەت بۆ ئایفۆنێ (TafsirKurd Style)

### 📥 دابەزاندن:
فایلا خوارێ **Dr-Smart.ipa** دابەزینە بۆ ناڤ ئایفۆنێ." || true


